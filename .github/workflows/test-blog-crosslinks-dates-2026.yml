name: Test blog publication dates and cross-links
on:
  push:
    branches: [fix/blog-publication-dates-crosslinks-2026-11]
    paths:
      - '.github/workflows/test-blog-crosslinks-dates-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - name: Validate content taxonomy
        run: python3 scripts/validate_content.py
      - name: Build all languages
        run: |
          hugo mod get github.com/nunocoracao/blowfish/v3@v3.9.0
          hugo --gc --minify --cleanDestinationDir
          python3 scripts/verify_generated_site.py
      - name: Confirm both blog-card publication dates and reciprocal links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Inspector(HTMLParser):
            def __init__(self):
              super().__init__()
              self.cards=[]
              self.current=None
              self.hrefs=set()
            def handle_starttag(self,tag,attrs):
              attrs=dict(attrs)
              if tag=="a" and attrs.get("href"):
                self.hrefs.add(attrs["href"])
              if tag=="article" and "sorure-event-card" in attrs.get("class","").split():
                self.current={"hrefs":set(),"dates":set()}
                self.cards.append(self.current)
              if self.current:
                if tag=="a" and attrs.get("href"):
                  self.current["hrefs"].add(attrs["href"])
                if tag=="time" and attrs.get("datetime"):
                  self.current["dates"].add(attrs["datetime"])
            def handle_endtag(self,tag):
              if tag=="article":
                self.current=None
          for lang in ("fa","en","fi"):
            root=Path("public")/lang/"blog"
            inspector=Inspector()
            inspector.feed((root/"index.html").read_text())
            assert inspector.cards,(lang,"no blog cards")
            for slug in ("persian-books-vaasa-library-2026","persian-language-standing-vaasa-library-2026"):
              target=f"/sorure-iranian-ry/{lang}/blog/{slug}/"
              matching=[card for card in inspector.cards if target in card["hrefs"]]
              assert len(matching)==1,(lang,slug,"card",len(matching),[sorted(c["hrefs"])[:1] for c in inspector.cards[:3]])
              assert "2026-11-19" in matching[0]["dates"],(lang,slug,"missing date",matching[0]["dates"])
            books=(root/"persian-books-vaasa-library-2026"/"index.html").read_text()
            ranks=(root/"persian-language-standing-vaasa-library-2026"/"index.html").read_text()
            outbound_books=Inspector();outbound_books.feed(books)
            outbound_ranks=Inspector();outbound_ranks.feed(ranks)
            assert f"/sorure-iranian-ry/{lang}/blog/persian-language-standing-vaasa-library-2026/" in outbound_books.hrefs,(lang,"books outbound",sorted(outbound_books.hrefs)[:8])
            assert f"/sorure-iranian-ry/{lang}/blog/persian-books-vaasa-library-2026/" in outbound_ranks.hrefs,(lang,"rankings outbound",sorted(outbound_ranks.hrefs)[:8])
            if lang=="fa":
              assert 'در بررسی قبلی انجمن' in ranks
              assert 'بازتأیید نکرده‌ایم' not in ranks
            if lang=="en":
              assert 'We did not independently revalidate' not in ranks
            if lang=="fi":
              assert 'Kaikkia lukuja ei ole tarkistettu' not in ranks
            print("BLOG_DATES_AND_LINKS_PASS",lang)
          PY
