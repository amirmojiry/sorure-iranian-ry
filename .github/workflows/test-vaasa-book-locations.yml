name: Test Vaasa book location metadata
on:
  push:
    branches: [feat/vaasa-book-locations-2026-11-20]
    paths: ['.github/workflows/test-vaasa-book-locations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - name: Validate catalogue records and location metadata
        run: |
          python3 scripts/validate_content.py
          python3 - <<'PY'
          import json,collections
          d=json.load(open('data/vaasa_persian_books.json'))
          items=d['materials']
          assert len(items)==315 and len({i['id'] for i in items})==315
          labels={x['id']:set(x['holding_locations']) for x in items}
          assert sum('main' in s for s in labels.values())==264
          assert sum('huudi' in s for s in labels.values())==4
          assert sum('variska' in s for s in labels.values())==1
          assert sum(len(s)==0 for s in labels.values())==48
          assert all(s <= {'main','huudi','variska'} for s in labels.values())
          special={
            'vaasa.d9b0a7ed-cf08-4052-95e7-2d34766af0ad':{'huudi'},
            'vaasa.2e90692c-e3ab-4730-b352-9fedec567d73':{'huudi'},
            'vaasa.74e53243-a87b-49d2-af04-4f268890f1ee':{'huudi'},
            'vaasa.e32c9910-790b-4648-8e3f-f9984f6f65d0':{'main','huudi'},
            'vaasa.cb6b6dca-718d-4def-8a08-c7be1bbceec8':{'main','variska'}
          }
          for k,v in special.items():assert labels.get(k)==v,(k,labels.get(k))
          print('LOCATION_DATA_PASS',len(items))
          PY
      - name: Hugo production build and smoke tests
        run: |
          hugo mod get github.com/nunocoracao/blowfish/v3@v3.9.0
          hugo --gc --minify --cleanDestinationDir
          python3 scripts/verify_generated_site.py
      - name: Check table columns, multiple locations and filter controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Inspect(HTMLParser):
            def __init__(self):
              super().__init__();self.rows=[];self.buttons=[];self.selects=[];self.urls=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='tr' and 'data-book-row' in d:self.rows.append(d)
              if tag=='button' and 'data-sort-key' in d:self.buttons.append(d['data-sort-key'])
              if tag=='select':
                for k in ('data-book-type-filter','data-book-language-filter','data-book-holding-filter'):
                  if k in d:self.selects.append(k)
              if tag=='a' and d.get('href','').startswith('https://vaasankirjasto.finna.fi/Record/'):self.urls.append(d['href'])
          expected={'order','title_fa','title_latin','material_type','language_finna','holdings','author_fa','author','year','indexed_date','isbn'}
          for lang in ('fa','en','fi'):
            root=Path('public')/lang/'blog'/'persian-books-vaasa-library-2026'/'index.html'
            assert root.exists(),root
            src=root.read_text(); parser=Inspect();parser.feed(src)
            assert len(parser.rows)==315,(lang,'rows',len(parser.rows))
            assert len(parser.buttons)==11 and set(parser.buttons)==expected,(lang,'sorts',parser.buttons)
            assert len(parser.selects)==3,(lang,'filters',parser.selects)
            assert sum('main' in x.get('data-holding-locations','').split(',') for x in parser.rows)==264
            assert sum('huudi' in x.get('data-holding-locations','').split(',') for x in parser.rows)==4
            assert sum('variska' in x.get('data-holding-locations','').split(',') for x in parser.rows)==1
            assert sum(x.get('data-holding-locations','')=='' for x in parser.rows)==48
            assert len(parser.urls)>=315
            print('LOCATION_HTML_PASS',lang,len(parser.rows),len(parser.buttons),len(parser.selects))
          PY
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path('layouts/shortcodes/vaasa-persian-books.html').read_text()
          Path('/tmp/location-table.js').write_text(re.search(r'<script>([\s\S]*?)</script>',src).group(1))
          PY
          node --check /tmp/location-table.js
