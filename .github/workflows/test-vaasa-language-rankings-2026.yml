name: Validate Vaasa language rankings
on:
  push:
    branches: [feat/vaasa-persian-language-rankings-2026]
    paths:
      - '.github/workflows/test-vaasa-language-rankings-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - name: Verify counts and rankings
        run: |
          python3 scripts/validate_content.py
          python3 - <<'PY'
          import json,collections
          a=json.load(open('data/vaasa_library_language_ranking_2026.json'))['languages']
          assert len(a)==146
          assert len(set(x['name_en'] for x in a))==146
          assert all(a[i]['count']>=a[i+1]['count'] for i in range(145))
          assert len([x for x in a if x['category']=='named_language'])==144
          assert len([x for x in a if x['iran_link']])==8
          assert [(x['count'],x['rank_all'],x['rank_named']) for x in a if x['name_en']=='Persian']==[(311,18,16)]
          assert {x['name_en']:(x['count'],x['rank_all']) for x in a if x['iran_link']}=={
             'Arabic':(430,13),'Persian':(311,18),'Turkish':(184,20),'Kurdish':(125,24),
             'Armenian':(5,73),'Iranian languages':(4,78),'Dari':(3,86),'Azerbaijani':(2,95)}
          assert all(x['row_order']==i+1 for i,x in enumerate(a))
          assert a[0]['name_en']=='Finnish' and a[-1]['name_en']=='Votic'
          print('LANG_DATA_PASS',len(a))
          PY
      - name: Build Hugo
        run: |
          hugo mod get github.com/nunocoracao/blowfish/v3@v3.9.0
          hugo --gc --minify --cleanDestinationDir
          python3 scripts/verify_generated_site.py
      - name: Verify all pages and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Inspector(HTMLParser):
            def __init__(self):super().__init__();self.rows=0;self.sort=[];self.search=0;self.filter=0;self.bars=0
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='tr' and 'data-language-row' in a:self.rows+=1
              if tag=='button' and 'data-sort-language' in a:self.sort.append(a['data-sort-language'])
              if tag=='input' and 'data-language-search' in a:self.search+=1
              if tag=='select' and 'data-language-filter' in a:self.filter+=1
              if tag=='progress' and a.get('max')=='477':self.bars+=1
          keys={'rank_all','rank_named','name_fa','name_en','count'}
          for lang in ('fa','en','fi'):
            f=Path('public')/lang/'blog'/'persian-language-standing-vaasa-library-2026'/'index.html'
            assert f.is_file(),f
            txt=f.read_text()
            x=Inspector();x.feed(txt)
            assert x.rows==146,(lang,'rows',x.rows)
            assert set(x.sort)==keys and len(x.sort)==5,(lang,'sort',x.sort)
            assert x.search==1 and x.filter==1,(lang,'controls',x.search,x.filter)
            assert x.bars==13,(lang,'bars',x.bars)
            assert 'data-sorure-languages' in txt
            assert 'vaasa-language-ranking' in txt
            print('LANG_HTML_PASS',lang,x.rows,x.bars)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('layouts/shortcodes/vaasa-language-ranking.html').read_text()
          js=re.search(r'<script>([\s\S]*?)</script>',src).group(1)
          Path('/tmp/language-ranking.js').write_text(js)
          PY
          node --check /tmp/language-ranking.js
