name: Deploy Hugo + Blowfish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Go (Hugo modules)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - name: Fetch pinned Blowfish theme
        run: hugo mod get github.com/nunocoracao/blowfish/v3@v3.9.0
      - name: Validate event and blog taxonomy metadata
        run: python3 scripts/validate_content.py
      - name: Build static site
        run: hugo --gc --minify --cleanDestinationDir
      - name: Verify taxonomy pages, navigation and event photos
        run: python3 scripts/verify_generated_site.py
      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@v4
