baseURL = "https://amirmojiry.github.io/sorure-iranian-ry/"
title = "Sorure Iranian ry"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = false
summaryLength = 24
buildFuture = false

[pagination]
  pagerSize = 12
[sitemap]
  changefreq = "monthly"
  priority = 0.5
[outputs]
  home = ["HTML", "RSS", "JSON"]
[taxonomies]
  eventcategory = "eventcategories"
  eventtag = "eventtags"
  blogcategory = "blogcategories"
  blogtag = "blogtags"
[imaging]
  anchor = "Center"
[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v3"
